name: network_analyzer
description: >-
  Network monitoring and analysis for mobile devices: real-time monitoring,
  throughput scanner, scanner history, and diagnostic tools (MTR, Ping,
  TCPing).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  network_analyzer_android:
    path: ../network_analyzer_android
  network_analyzer_ios:
    path: ../network_analyzer_ios
  network_analyzer_platform_interface:
    path: ../network_analyzer_platform_interface

dev_dependencies:
  checks: ^0.3.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      android:
        default_package: network_analyzer_android
      ios:
        default_package: network_analyzer_ios
